[theme]
# Leave the base unset so Streamlit can use the user's selected light/dark theme.
primaryColor = "#60a5fa"
showSidebarBorder = true

[theme.dark]
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#111827"
textColor = "#e5e7eb"
borderColor = "#334155"

[theme.light]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8fafc"
textColor = "#111827"
borderColor = "#e2e8f0"

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = true
